<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Healthcare Case Review</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">Agentic Healthcare Pipeline</p>
          <h1>Case Review Decisions</h1>
        </div>
        <div class="summary" id="summary"></div>
      </section>

      <section class="controls" aria-label="Dashboard controls">
        <label>
          <span>Case ID</span>
          <input id="caseIdInput" type="search" placeholder="Example: HC-007">
        </label>
        <button class="load-button" id="loadCaseButton" type="button">Load Case</button>
      </section>

      <section class="layout">
        <aside class="case-list" aria-label="Cases">
          <div class="list-header">
            <h2>Cases</h2>
            <span id="caseCount"></span>
          </div>
          <div id="caseList"></div>
        </aside>

        <section class="detail" id="caseDetail" aria-live="polite">
          <div class="empty-state">Loading decisions...</div>
        </section>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
